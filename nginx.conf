# ──────────────────────────────────────────────
# Nginx Reverse Proxy Configuration
# Replace api.mulcart.cloud with your actual domain (e.g., api.yourstore.com)
# ──────────────────────────────────────────────

# Rate limiting for webhook endpoints
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.mulcart.cloud;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api.mulcart.cloud;

    # SSL certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/api.mulcart.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mulcart.cloud/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy settings
    location / {
        limit_req zone=webhooks burst=50 nodelay;

        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Important: preserve original body for HMAC validation
        proxy_request_buffering on;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://app:5000/health;
        proxy_http_version 1.1;
        access_log off;
    }
}
