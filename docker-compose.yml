version: '3.8'

services:
  # ──────────────────────────────────────────────
  # ASP.NET Core API
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopify-whatsapp-api
    restart: always
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shopify_whatsapp;Username=postgres;Password=${DB_PASSWORD}
      - WhatsApp__PhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID}
      - WhatsApp__AccessToken=${WHATSAPP_ACCESS_TOKEN}
      - WhatsApp__VerifyToken=${WHATSAPP_VERIFY_TOKEN}
      - WhatsApp__AppSecret=${WHATSAPP_APP_SECRET}
      - Shopify__ApiKey=${SHOPIFY_API_KEY}
      - Shopify__ApiSecret=${SHOPIFY_API_SECRET}
      - Shopify__AccessToken=${SHOPIFY_ACCESS_TOKEN}
      - Shopify__ShopDomain=${SHOPIFY_SHOP_DOMAIN}
      - Shopify__WebhookSecret=${SHOPIFY_WEBHOOK_SECRET}
      - Shopify__WebhookBaseUrl=${WEBHOOK_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    networks:
      - app-network

  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: shopify-whatsapp-db
    restart: always
    environment:
      POSTGRES_DB: shopify_whatsapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ──────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shopify-whatsapp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app-network

  # ──────────────────────────────────────────────
  # Certbot (SSL certificates)
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: shopify-whatsapp-certbot
    restart: always
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

volumes:
  postgres-data:
  app-logs:
  certbot-conf:
  certbot-www:

networks:
  app-network:
    driver: bridge
